    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* ================= LANGUAGE SWITCHER ================= */

        const languageBtn = document.getElementById("languageBtn");
        const languageMenu = document.getElementById("languageMenu");
        const languageText = document.getElementById("languageText");


        /* Open / Close Language Menu */

        languageBtn.addEventListener("click", () => {

            languageMenu.classList.toggle("show");

        });


        /* Change Language */

        function changeLanguage(language) {

            const elements = document.querySelectorAll("[data-en]");

            elements.forEach(element => {

                if (language === "sw") {

                    element.textContent = element.getAttribute("data-sw");

                } else {

                    element.textContent = element.getAttribute("data-en");

                }

            });


            /* Change Placeholders */

            const inputs = document.querySelectorAll(
                "[data-placeholder-en]"
            );

            inputs.forEach(input => {

                if (language === "sw") {

                    input.placeholder =
                        input.getAttribute("data-placeholder-sw");

                } else {

                    input.placeholder =
                        input.getAttribute("data-placeholder-en");

                }

            });


            /* Change Button Text */

            languageText.textContent =
                language === "sw" ? "SW" : "EN";


            /* Change HTML Language */

            document.documentElement.lang =
                language === "sw" ? "sw" : "en";


            /* Close Language Menu */

            languageMenu.classList.remove("show");


            /* Save Language */

            localStorage.setItem("selectedLanguage", language);

        }


        /* Load Saved Language */

        const savedLanguage =
            localStorage.getItem("selectedLanguage") || "en";

        changeLanguage(savedLanguage);


        /* ================= MOBILE MENU ================= */

        const menuToggle =
            document.getElementById("menuToggle");

        const navMenu =
            document.getElementById("navMenu");


        menuToggle.addEventListener("click", () => {

            navMenu.classList.toggle("show");

            const icon =
                menuToggle.querySelector("i");


            if (navMenu.classList.contains("show")) {

                icon.classList.remove("fa-bars");

                icon.classList.add("fa-xmark");

            } else {

                icon.classList.remove("fa-xmark");

                icon.classList.add("fa-bars");

            }

        });


        /* Close Mobile Menu */

        document.querySelectorAll(
            ".nav-link, .nav-contact"
        ).forEach(link => {

            link.addEventListener("click", () => {

                navMenu.classList.remove("show");

                const icon =
                    menuToggle.querySelector("i");

                icon.classList.remove("fa-xmark");

                icon.classList.add("fa-bars");

            });

        });


        /* Close Language Menu When Clicking Outside */

        document.addEventListener("click", (event) => {

            if (
                !event.target.closest(".language-switcher")
            ) {

                languageMenu.classList.remove("show");

            }

        });

    </script>
