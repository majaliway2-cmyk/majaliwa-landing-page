<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Page not found — back to Majaliwa Yahaya's website.">

    <title>404 — Page Not Found | Majaliwa Yahaya</title>

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: "Inter", Arial, sans-serif;

            color: #ffffff;
            text-align: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(8, 168, 255, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(74, 53, 232, 0.12),
                    transparent 35%
                ),
                #020817;
        }

        .card {
            max-width: 560px;

            padding: 50px 40px;

            border: 1px solid rgba(91, 179, 255, 0.3);

            border-radius: 22px;

            background: rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .logo-icon {
            width: 56px;
            height: 56px;

            margin: 0 auto 26px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            font-size: 28px;
            font-weight: 800;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #00d9ff,
                    #2563eb 50%,
                    #7c3aed
                );
        }

        h1 {
            font-size: 88px;
            line-height: 1;

            background:
                linear-gradient(
                    100deg,
                    #00d9ff 5%,
                    #4c79ff 45%,
                    #d536ff 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        p {
            margin: 18px 0 30px;

            color: #c6d1ee;

            font-size: 16px;
            line-height: 1.7;
        }

        a.btn {
            display: inline-flex;
            align-items: center;

            gap: 10px;

            padding: 15px 30px;

            border-radius: 999px;

            background:
                linear-gradient(
                    100deg,
                    #b72dff,
                    #6d54ff 48%,
                    #168eff
                );

            color: #ffffff;
            font-weight: 700;

            text-decoration: none;

            transition: 0.3s ease;
        }

        a.btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 18px 45px rgba(106, 55, 255, 0.48);
        }

        footer {
            margin-top: 32px;

            color: #9ca9ca;

            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo-icon">M</div>

        <h1>404</h1>

        <p>The page you are looking for doesn't exist or has been moved.</p>

        <a class="btn" href="index.html">Back to Home &rarr;</a>

        <footer>&copy; 2026 Majaliwa Yahaya. All Rights Reserved.</footer>

    </div>

</body>

</html>
